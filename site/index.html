<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captcha Channels</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#F9FCFE; --bg2:#E6EFF6;
  --ink:#3E4A55; --ink2:#4F5B66; --ink3:#5A6570;
  --blue:#2FA3E0; --blue-d:#1E88D6; --blue-ink:#2B6FA0;
  --edge:#E1E9F0; --shadow:rgba(60,90,120,.20);
  --bar-h:124px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2))}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:3px}

/* ---------- layout ---------- */
/* #app is the only scroll container, so the bar stays pinned to the viewport
   instead of scrolling away with the grid. */
#app{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;
     overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--bar-h) + 24px);scrollbar-gutter:stable}
#app.locked{overflow:hidden}
header{margin-top:26px;text-align:center;flex:0 0 auto}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:3px}
header p{margin:2px 0 0;font-size:14px;font-weight:700;color:var(--ink3)}
#grid{margin-top:18px;width:min(1064px,calc(100% - 32px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 24px;transition:opacity .12s ease}
#grid.dim{opacity:0;pointer-events:none}

/* ---------- channel tile (TV screen) ---------- */
.tile{position:relative;display:block;width:100%;height:160px;padding:0;border:0;background:none;transition:transform .15s ease}
.tile:hover{transform:translateY(-4px)}
.tile .bezel{position:absolute;inset:0 0 auto 0;height:130px;padding:8px;border-radius:22px;background:#fff;box-shadow:0 8px 18px var(--shadow),inset 0 0 0 2px var(--edge)}
.tile .screen{position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden}
.tile .chip{position:absolute;left:8px;top:8px;z-index:2;padding:2px 9px;border-radius:999px;background:#fff;color:var(--ink2);font-size:12px;font-weight:800}
.tile .name{position:absolute;left:0;right:0;top:136px;text-align:center;font-size:14px;font-weight:800;color:var(--ink2)}
.tile.sel::after{content:"";position:absolute;left:-5px;right:-5px;top:-5px;height:140px;border-radius:27px;border:4px solid var(--blue);box-shadow:0 0 22px rgba(47,163,224,.65);pointer-events:none}
.tile .badge{position:absolute;right:-8px;top:-10px;width:34px;height:34px;border-radius:50%;background:var(--blue-d);color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(30,136,214,.5)}
.tile.empty .bezel{border:3px dashed #A9C4D8;background:rgba(255,255,255,.55);box-shadow:none;display:flex;align-items:center;justify-content:center}
.tile.empty .name{color:#3B79A6}

/* ---------- level previews inside the tiles ---------- */
.pv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:10px}
.pv-text{font-size:19px;font-weight:900;letter-spacing:1px;color:#2B6FA0}
.pv-text span{display:inline-block}
.pv-text span:nth-child(2n){transform:rotate(-9deg) translateY(3px);opacity:.75}
.pv-text span:nth-child(3n){transform:rotate(7deg) translateY(-3px);opacity:.9}
.pv-sum{font-size:20px;font-weight:900;color:#1E5F91}
.pv-sum b{color:var(--blue-d);padding:0 4px}
.pv-odd{display:grid;grid-template-columns:repeat(3,16px);gap:6px}
.pv-odd i{width:16px;height:16px;border-radius:50%;background:#7FD36B;display:block}
.pv-odd i:nth-child(5){background:#F78FB3;border-radius:3px}
.pv-slide{display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.pv-slide i{width:22px;height:22px;border-radius:5px;background:#fff;color:#2B6FA0;font-size:11px;font-weight:900;font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 #C4DDEC}
.pv-slide i.gap{background:transparent;box-shadow:none}
.pv-pairs{display:grid;grid-template-columns:repeat(3,22px);gap:5px}
.pv-pairs i{width:22px;height:28px;border-radius:5px;background:linear-gradient(180deg,#fff,#E6F2FA);box-shadow:0 2px 0 #C4DDEC;display:block}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:var(--bar-h);
     padding:0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
     border-radius:70px 70px 0 0;background:#fff;box-shadow:0 -6px 24px rgba(60,90,120,.14);
     display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .18s ease}
#bar.hide{transform:translateY(140px)}
.round{width:96px;height:96px;flex:0 0 auto;margin-top:-4px;border-radius:50%;border:3px solid #CFE3F1;background:linear-gradient(180deg,#fff,#E6F2FA);box-shadow:0 6px 14px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;color:var(--blue-ink);font-size:13px;font-weight:900;transition:transform .15s ease}
.round:hover{transform:translateY(-16px)}
.round.primary{border-color:var(--blue);background:linear-gradient(180deg,#52BAF0,var(--blue-d));box-shadow:0 6px 14px rgba(30,136,214,.35);color:#fff}
#status{flex:1 1 auto;min-width:0;max-width:420px;height:64px;padding:0 24px;border-radius:32px;background:#EFF6FB;box-shadow:inset 0 2px 6px rgba(60,90,120,.14);display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:800}
.right{display:flex;gap:16px;align-items:center;flex:0 0 auto}

/* ---------- contribute popover ---------- */
#pop{position:fixed;left:max(16px, env(safe-area-inset-left));bottom:calc(var(--bar-h) + 20px);width:320px;max-width:calc(100vw - 32px);padding:18px;border-radius:24px;background:#fff;box-shadow:0 12px 32px rgba(60,90,120,.28),inset 0 0 0 2px var(--edge);display:none;flex-direction:column;gap:10px;z-index:30}
#pop.open{display:flex}
#pop h2{margin:0;font-size:16px;font-weight:900}
#pop a, #pop .popitem{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:0;background:#EAF4FB;text-decoration:none;color:#1E5F91;font-size:15px;font-weight:800}
#pop a:hover, #pop .popitem:hover{background:#DCEEFA}
#pop a small, #pop .popitem small{display:block;font-size:13px;font-weight:700;color:var(--ink2)}

/* ---------- submit form ---------- */
#sub{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;background:rgba(40,70,95,.35);overflow-y:auto}
#sub.open{display:flex}
#sub form{width:min(520px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 48px rgba(30,70,100,.35);display:flex;flex-direction:column;gap:12px}
#sub .subhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
#sub h2{margin:0;font-size:19px;font-weight:900}
#sub .x{border:0;background:#EFF6FB;color:var(--ink2);width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:900}
#sub .subnote{margin:0;font-size:13px;font-weight:700;color:var(--ink3);line-height:1.4}
#sub label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
#sub input, #sub textarea{font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:11px 13px;border-radius:12px;border:2px solid #CFE3F1;background:#FBFDFF;text-transform:none;letter-spacing:normal}
#sub textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
#sub input:focus, #sub textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,163,224,.2)}
#sub .primary{height:50px;border-radius:25px;border:0;background:var(--blue-d);color:#fff;font-size:15px;font-weight:900}
#sub .primary:disabled{opacity:.6}
#sub .feedback{min-height:1.2rem;margin:0;font-size:13px;font-weight:800;text-align:center}
#sub .feedback.ok{color:#2F9E44}
#sub .feedback.bad{color:#D9480F}
#sub .back{align-self:center;border:0;background:none;color:var(--ink3);font-size:13px;font-weight:800;text-decoration:underline}
.hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0!important}

/* ---------- open-channel animation ---------- */
#sheet{position:fixed;z-index:10;display:none;overflow:hidden;will-change:left,top,width,height}
#sheet.on{display:block}
#sheet .stage{position:absolute;inset:0;display:flex;flex-direction:column}
#sheet .top{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.85)}
#sheet .top h2{margin:0;font-size:20px;font-weight:900}
#sheet .top .prog{font-size:15px;font-weight:800;color:var(--ink3)}
#back{height:44px;padding:0 22px;border-radius:22px;border:3px solid #CFE3F1;background:linear-gradient(180deg,#fff,#E6F2FA);color:var(--blue-ink);font-size:15px;font-weight:900}
#level{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .1s ease;overflow-y:auto}
#level .stub{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#level .stub button{height:48px;padding:0 28px;border-radius:24px;border:0;background:var(--blue-d);color:#fff;font-size:16px;font-weight:900}

/* ---------- level internals ---------- */
.lv{width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.lv h3{margin:0;font-size:20px;font-weight:900}
.lv p{margin:0;font-size:15px;font-weight:700;color:var(--ink2);line-height:1.45}
.lv input[type=text]{width:100%;height:52px;padding:0 18px;border-radius:16px;border:3px solid #CFE3F1;background:#fff;font-family:inherit;font-size:17px;font-weight:800;color:var(--ink);text-align:center}
.lv .primary{height:52px;padding:0 30px;border-radius:26px;border:0;background:var(--blue-d);color:#fff;font-size:16px;font-weight:900;box-shadow:0 4px 0 #14639B}
.lv .primary:active{transform:translateY(2px);box-shadow:0 2px 0 #14639B}
.lv .wrong{animation:shk .32s ease}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lv .prompt{font-size:30px;font-weight:900;letter-spacing:3px;color:var(--blue-ink);background:#fff;border-radius:16px;padding:16px 24px;box-shadow:inset 0 0 0 3px var(--edge);word-break:break-word;max-width:100%}
.wonky span{display:inline-block}
.shapegrid{display:grid;gap:10px;padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px var(--edge)}
.shapegrid button{width:52px;height:52px;border-radius:12px;border:0;background:#F2F8FC;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
.shapegrid button:hover{background:#E4F2FA}
.puzzle{display:grid;grid-template-columns:repeat(3,74px);gap:8px;padding:12px;border-radius:18px;background:#EAF4FB;box-shadow:inset 0 0 0 3px var(--edge)}
.puzzle button{width:74px;height:74px;border-radius:14px;border:0;background:linear-gradient(180deg,#fff,#E6F2FA);color:var(--blue-ink);font-size:24px;font-weight:900;box-shadow:0 3px 0 #C4DDEC}
.puzzle button.blank{background:transparent;box-shadow:none;pointer-events:none}
.pairs{display:grid;grid-template-columns:repeat(4,64px);gap:10px}
.pairs button{width:64px;height:64px;border-radius:14px;border:0;background:linear-gradient(180deg,#fff,#E6F2FA);font-size:26px;color:transparent;box-shadow:0 3px 0 #C4DDEC}
.pairs button.face,.pairs button.done{color:inherit;background:#E7F6EC;box-shadow:0 3px 0 #B7E2C1}
.pairs button.done{pointer-events:none}

@media (max-width:560px){
  :root{--bar-h:104px}
  header{margin-top:16px}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
  .tile{height:146px}
  .tile .bezel{height:118px}
  .tile .name{top:124px;font-size:13px}
  .round{width:64px;height:64px;font-size:11px}
  .round svg{width:22px;height:22px}
  #status{height:52px;font-size:13px;padding:0 12px}
  .puzzle{grid-template-columns:repeat(3,62px)}
  .puzzle button{width:62px;height:62px;font-size:20px}
  .shapegrid{grid-template-columns:repeat(4,44px)!important}
  .shapegrid button{width:44px;height:44px;font-size:22px}
  .pairs{grid-template-columns:repeat(4,56px)}
  .pairs button{width:56px;height:56px}
  .pv-text{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.tile,.round,#bar,#grid,#level{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1>CAPTCHA CHANNELS</h1><p>Prove you're human. Five to start.</p></header>
  <div id="grid" role="list"></div>

  <div id="pop" role="dialog" aria-label="Add a channel">
    <h2>Add a channel</h2>
    <button class="popitem" type="button" id="openSubmit">Submit a level<small>Type it here — no GitHub account needed</small></button>
    <a id="issueLink" target="_blank" rel="noopener">Have an idea?<small>Open an issue on GitHub</small></a>
  </div>

  <div id="sub" role="dialog" aria-modal="true" aria-label="Submit a level">
    <form id="subform" autocomplete="off">
      <div class="subhead">
        <h2>Submit a level</h2>
        <button type="button" class="x" id="subClose" aria-label="Close">✕</button>
      </div>
      <p class="subnote">Filed anonymously as a GitHub issue. A maintainer reviews it before it ships.</p>
      <label>Level id <input id="f_id" required pattern="[a-z0-9_]{3,40}" placeholder="backwards" spellcheck="false"></label>
      <label>Title <input id="f_title" required maxlength="80" placeholder="Backwards Check"></label>
      <label>Description <input id="f_desc" required maxlength="200" placeholder="Read it the other way round."></label>
      <label>Prompt (what the player sees) <input id="f_prompt" required maxlength="300" placeholder="dlrow olleh"></label>
      <label>Python solution <textarea id="f_solution" required rows="6" spellcheck="false" placeholder="def solve(prompt):&#10;    return prompt[::-1]"></textarea></label>
      <input id="f_website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="primary" id="subSend">File submission</button>
      <p class="feedback" id="subMsg" role="status" aria-live="polite"></p>
      <button type="button" class="back" id="subCancel">Cancel</button>
    </form>
  </div>

  <div id="bar">
    <button id="contribBtn" class="round" aria-label="Contribute: open a pull request or suggest an idea on GitHub">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#2B6FA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 7.2v9.6M18 11.2c0 4-6 3-11 6"/></svg>
      Contribute
    </button>
    <div id="status" role="status" aria-live="polite">Pick a channel, or let fate decide.</div>
    <div class="right">
      <button id="randomBtn" class="round" aria-label="Random game">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#2B6FA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="#2B6FA0"/><circle cx="15.5" cy="8.5" r="1" fill="#2B6FA0"/><circle cx="12" cy="12" r="1" fill="#2B6FA0"/><circle cx="8.5" cy="15.5" r="1" fill="#2B6FA0"/><circle cx="15.5" cy="15.5" r="1" fill="#2B6FA0"/></svg>
        Random
      </button>
      <button id="rushBtn" class="round primary" aria-label="Rushdown mode: every level in random order">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg>
        <span id="rushLabel">Rushdown</span>
      </button>
    </div>
  </div>

  <div id="sheet" role="dialog" aria-modal="true" aria-label="Level">
    <div class="stage">
      <div class="top">
        <h2 id="lvlTitle"></h2>
        <span class="prog" id="lvlProg"></span>
        <button id="back">Back</button>
      </div>
      <div id="level"></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const REPO = 'https://github.com/abduznik/verifier';

/* =====================================================================
   HELPERS
   ===================================================================== */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shufflex = a => { for (let k = a.length - 1; k > 0; k--){ const j = rnd(k + 1); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const mk = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

function reject(el){
  el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  const box = el.querySelector('input'); if (box){ box.value = ''; box.focus(); }
}

/* ---- 1. Wonky Text ---- */
function wonkyText(){
  const words = ['HUMAN','VERIFY','TOASTER','MANGO','TURING','CARROT','PENGUIN','BANANA'];
  return function mount(el, api){
    const word = pick(words);
    const wrap = mk('div', 'lv');
    const wonky = word.split('').map(c =>
      '<span style="transform:rotate(' + (rnd(17) - 8) + 'deg) translateY(' + (rnd(9) - 4) + 'px);opacity:' + (0.75 + Math.random() * 0.25).toFixed(2) + '">' + c + '</span>'
    ).join('');
    wrap.innerHTML = '<h3>Wonky Text</h3><p>Type what you see.</p><div class="prompt wonky">' + wonky + '</div>' +
      '<input type="text" aria-label="Type the word" spellcheck="false" autocomplete="off" autocapitalize="characters"><button class="primary" type="button">Check</button>';
    el.appendChild(wrap);
    const box = wrap.querySelector('input'), btn = wrap.querySelector('button');
    const check = () => box.value.trim().toUpperCase() === word ? api.complete() : reject(wrap);
    btn.onclick = check;
    box.onkeydown = e => { if (e.key === 'Enter') check(); };
    box.focus();
  };
}

/* ---- 2. Slide Puzzle ---- */
function slidePuzzle(){
  return function mount(el, api){
    const wrap = mk('div', 'lv');
    wrap.innerHTML = '<h3>Slide Puzzle</h3><p>Put the numbers back in order. Click a tile next to the gap.</p><div class="puzzle"></div>';
    el.appendChild(wrap);
    const grid = wrap.querySelector('.puzzle');
    let state;
    do {
      state = [1,2,3,4,5,6,7,8,0];
      let blank = 8;
      for (let n = 0; n < 60; n++){
        const r = Math.floor(blank / 3), c = blank % 3;
        const opts = [];
        if (r > 0) opts.push(blank - 3);
        if (r < 2) opts.push(blank + 3);
        if (c > 0) opts.push(blank - 1);
        if (c < 2) opts.push(blank + 1);
        const t = pick(opts);
        [state[blank], state[t]] = [state[t], state[blank]];
        blank = t;
      }
    } while (state.every((v, i) => v === (i + 1) % 9));

    function draw(){
      grid.innerHTML = '';
      state.forEach((v, i) => {
        const b = mk('button', v === 0 ? 'blank' : '', v === 0 ? '' : v);
        b.type = 'button';
        b.setAttribute('aria-label', v === 0 ? 'empty' : 'tile ' + v);
        b.onclick = () => move(i);
        grid.appendChild(b);
      });
    }
    function move(i){
      const b = state.indexOf(0);
      const ok = (Math.abs(i - b) === 1 && Math.floor(i / 3) === Math.floor(b / 3)) || Math.abs(i - b) === 3;
      if (!ok) return;
      [state[i], state[b]] = [state[b], state[i]];
      draw();
      if (state.every((v, k) => v === (k + 1) % 9)) api.complete();
    }
    draw();
  };
}

/* ---- 3. Odd One Out ---- */
function oddOneOut(){
  return function mount(el, api){
    const size = 4, total = size * size, odd = rnd(total);
    const base = pick(['●','▲','■','◆','⬢']);
    const other = pick(['●','▲','■','◆','⬢'].filter(s => s !== base));
    const wrap = mk('div', 'lv');
    wrap.innerHTML = '<h3>Odd One Out</h3><p>One shape is different. Find it.</p><div class="shapegrid" style="grid-template-columns:repeat(' + size + ',52px)"></div>';
    el.appendChild(wrap);
    const g = wrap.querySelector('.shapegrid');
    for (let i = 0; i < total; i++){
      const isOdd = i === odd;
      const b = mk('button', '', isOdd ? other : base);
      b.type = 'button';
      b.style.color = isOdd ? '#F78FB3' : '#5A6570';
      b.onclick = () => isOdd ? api.complete() : reject(wrap);
      g.appendChild(b);
    }
  };
}

/* ---- 4. Sum It Up ---- */
function sumItUp(){
  return function mount(el, api){
    const a = 3 + rnd(28), b = 2 + rnd(19);
    const wrap = mk('div', 'lv');
    wrap.innerHTML = '<h3>Sum It Up</h3><p>What is ' + a + ' + ' + b + '?</p>' +
      '<input type="text" inputmode="numeric" aria-label="Your answer" autocomplete="off"><button class="primary" type="button">Check</button>';
    el.appendChild(wrap);
    const box = wrap.querySelector('input'), btn = wrap.querySelector('button');
    const check = () => box.value.trim() === String(a + b) ? api.complete() : reject(wrap);
    btn.onclick = check;
    box.onkeydown = e => { if (e.key === 'Enter') check(); };
    box.focus();
  };
}

/* ---- 5. Pick Pairs ---- */
function pickPairs(){
  return function mount(el, api){
    const faces = shufflex(['🍎','🍇','🍋','🍑','🍎','🍇','🍋','🍑']);
    const wrap = mk('div', 'lv');
    wrap.innerHTML = '<h3>Pick Pairs</h3><p>Find all four pairs.</p><div class="pairs"></div>';
    el.appendChild(wrap);
    const g = wrap.querySelector('.pairs');
    let first = null, locked = false, found = 0;
    const timers = [];
    faces.forEach(f => {
      const b = mk('button', '', f);
      b.type = 'button';
      b.setAttribute('aria-label', 'card');
      b.onclick = () => flip(b, f);
      g.appendChild(b);
    });
    function flip(b, f){
      if (locked || b.classList.contains('done') || b === first) return;
      b.classList.add('face');
      if (!first){ first = b; first.dataset.f = f; return; }
      locked = true;
      if (first.dataset.f === f){
        first.classList.add('done'); b.classList.add('done');
        found++; first = null; locked = false;
        if (found === 4) api.complete();
      } else {
        timers.push(setTimeout(() => {
          first.classList.remove('face'); b.classList.remove('face');
          first = null; locked = false;
        }, 620));
      }
    }
    return () => timers.forEach(clearTimeout);
  };
}

/* =====================================================================
   LEVEL REGISTRY — tile preview + mount
   ===================================================================== */
const PREVIEW = {
  wonky: '<div class="pv pv-text">H<span>U</span>M<span>A</span>N</div>',
  slide: '<div class="pv"><div class="pv-slide">' + [1,2,3,4,5,6,7,'',8].map(v => '<i class="' + (v === '' ? 'gap' : '') + '">' + v + '</i>').join('') + '</div></div>',
  odd:   '<div class="pv"><div class="pv-odd">' + Array(9).fill('<i></i>').join('') + '</div></div>',
  sum:   '<div class="pv pv-sum">24 <b>+</b> 20</div>',
  pairs: '<div class="pv"><div class="pv-pairs">' + Array(6).fill('<i></i>').join('') + '</div></div>'
};

const LEVELS = [
  { id:'wonky-text',   name:'Wonky Text',   preview: PREVIEW.wonky, mount: wonkyText() },
  { id:'slide-puzzle', name:'Slide Puzzle', preview: PREVIEW.slide, mount: slidePuzzle() },
  { id:'odd-one-out',  name:'Odd One Out',  preview: PREVIEW.odd,   mount: oddOneOut() },
  { id:'sum-it-up',    name:'Sum It Up',    preview: PREVIEW.sum,   mount: sumItUp() },
  { id:'pick-pairs',   name:'Pick Pairs',   preview: PREVIEW.pairs, mount: pickPairs() }
];

/* =====================================================================
   TOKENS
   ===================================================================== */
const BGS = ['#EAF4FB','#EEF8E9','#FFF3E0','#FDEBF2','#F0ECFE','#E5F7F4','#FFF9DC','#FFEDED'];
const pad = n => (n < 10 ? '0' : '') + n;

/* =====================================================================
   STATE + DOM
   ===================================================================== */
const $ = id => document.getElementById(id);
const grid = $('grid'), sheet = $('sheet'), statusEl = $('status'), app = $('app');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tiles = [], timers = [], rush = null, openIdx = -1, cleanup = null, busy = false;

function setStatus(t){ statusEl.textContent = t; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function buildGrid(){
  grid.innerHTML = '';
  tiles = [];
  for (let i = 0; i <= LEVELS.length; i++){
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'listitem');
    if (i < LEVELS.length){
      b.className = 'tile';
      b.setAttribute('aria-label', 'Level ' + (i + 1) + ': ' + LEVELS[i].name);
      b.innerHTML = '<div class="bezel"><div class="screen" style="background:' + BGS[i % 8] + '">' +
        '<span class="chip">' + pad(i + 1) + '</span>' + (LEVELS[i].preview || '') +
        '</div></div><div class="name">' + LEVELS[i].name + '</div>';
      b.onclick = () => { if (!busy) { endRush(); selectOnly(i); openLevel(i); } };
    } else {
      b.className = 'tile empty';
      b.setAttribute('aria-label', 'Add your own level');
      b.innerHTML = '<div class="bezel"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#2C86C2" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div><div class="name">Your level here</div>';
      b.onclick = () => { $('pop').classList.toggle('open'); setStatus('Got a level in mind? Add the next channel.'); };
    }
    grid.appendChild(b);
    tiles.push(b);
  }
}
function selectOnly(i){ tiles.forEach((t, k) => t.classList.toggle('sel', k === i)); }
function clearBadges(){ tiles.forEach(t => { t.classList.remove('sel'); const bd = t.querySelector('.badge'); if (bd) bd.remove(); }); }

/* =====================================================================
   OPEN / CLOSE ANIMATION
   ===================================================================== */
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const dur = ms => reduce ? 0 : ms;
// animation.finished never settles when the tab is backgrounded or the element
// is hidden, which would leave `busy` stuck true and freeze the whole app.
const after = (anim, ms) => Promise.race([
  anim.finished.catch(() => {}),
  new Promise(r => setTimeout(r, ms + 60))
]);
function rectOf(el){ const r = el.getBoundingClientRect(); return { left:r.left, top:r.top, width:r.width, height:r.height }; }
function frame(r, radius){ return { left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px', borderRadius:radius+'px' }; }

function mountLevel(i){
  const lvl = LEVELS[i];
  if (cleanup){ try { cleanup(); } catch(e){} cleanup = null; }
  $('lvlTitle').textContent = 'Level ' + pad(i + 1) + ' · ' + lvl.name;
  $('lvlProg').textContent = rush ? (rush.pos + 1) + ' / ' + rush.order.length : '';
  const el = $('level'); el.innerHTML = '';
  cleanup = lvl.mount(el, { complete: onComplete, fail: () => mountLevel(i) }) || null;
}

async function openLevel(i){
  // A second tap while the first open is still animating would leave the
  // stage at opacity 0 behind a fully grown sheet: a blank screen. Guard on
  // the sheet actually being open, not on `busy` alone.
  if (sheet.classList.contains('on')){ if (!busy && i !== openIdx) { await closeLevel(true); } else { return; } }
  busy = true; openIdx = i;
  $('pop').classList.remove('open');
  const screen = tiles[i].querySelector('.screen');
  const from = rectOf(screen);
  const full = { left:0, top:0, width:innerWidth, height:innerHeight };
  sheet.style.background = BGS[i % 8];
  Object.assign(sheet.style, frame(from, 15));
  sheet.querySelector('.stage').style.opacity = 0;
  sheet.classList.add('on');
  app.classList.add('locked');
  grid.classList.add('dim'); $('bar').classList.add('hide');

  const grow = sheet.animate([frame(from, 15), frame(full, 0)], { duration: dur(260), easing: EASE, fill:'forwards' });
  await after(grow, dur(260));
  Object.assign(sheet.style, frame(full, 0)); grow.cancel();

  mountLevel(i);
  const stage = sheet.querySelector('.stage');
  stage.style.opacity = 1;
  stage.animate([{ opacity:0, transform:'translateY(12px)' }, { opacity:1, transform:'none' }], { duration: dur(130), easing:'ease-out', fill:'forwards' });
  $('back').focus();
  busy = false;
}

async function closeLevel(keepStatus){
  if (openIdx < 0) return;
  busy = true;
  const i = openIdx;
  if (cleanup){ try { cleanup(); } catch(e){} cleanup = null; }
  const stage = sheet.querySelector('.stage');
  await after(stage.animate([{ opacity:1 }, { opacity:0 }], { duration: dur(80), fill:'forwards' }), dur(80));
  grid.classList.remove('dim'); $('bar').classList.remove('hide');
  app.classList.remove('locked');
  const to = rectOf(tiles[i].querySelector('.screen'));
  const full = { left:0, top:0, width:innerWidth, height:innerHeight };
  const shrink = sheet.animate([frame(full, 0), frame(to, 15)], { duration: dur(230), easing: EASE, fill:'forwards' });
  await after(shrink, dur(230));
  sheet.classList.remove('on'); shrink.cancel();
  openIdx = -1; busy = false;
  tiles[i].focus();
  if (!keepStatus) setStatus(rush ? 'Rushdown stopped.' : 'Pick a channel, or let fate decide.');
  if (rush) endRush(true);
}

/* =====================================================================
   RANDOM + RUSHDOWN
   ===================================================================== */
function randomPlay(){
  if (busy) return;
  endRush(); clearTimers(); clearBadges();
  const final = rnd(LEVELS.length), steps = 14;
  let delay = 0; setStatus('Rolling…');
  for (let s = 0; s < steps; s++){
    delay += 60 + s * 14;
    const idx = s === steps - 1 ? final : rnd(LEVELS.length);
    timers.push(setTimeout(() => {
      selectOnly(idx);
      if (s === steps - 1){
        setStatus('Random pick: ' + pad(idx + 1) + ' · ' + LEVELS[idx].name);
        timers.push(setTimeout(() => openLevel(idx), 350));
      }
    }, delay));
  }
}

function startRush(){
  if (busy) return;
  clearTimers(); clearBadges();
  const order = shufflex(LEVELS.map((_, i) => i));
  rush = { order, pos: 0 };
  order.forEach((idx, n) => {
    const bd = document.createElement('div'); bd.className = 'badge'; bd.textContent = n + 1;
    tiles[idx].appendChild(bd);
  });
  $('rushLabel').textContent = 'Stop';
  setStatus('Rushdown: all ' + order.length + ' levels, random order.');
  timers.push(setTimeout(() => { selectOnly(order[0]); openLevel(order[0]); }, 700));
}
function endRush(silent){
  if (!rush) return;
  rush = null; clearTimers(); clearBadges();
  $('rushLabel').textContent = 'Rushdown';
  if (!silent) setStatus('Pick a channel, or let fate decide.');
}

function onComplete(){
  if (!rush){ setStatus('Level cleared!'); closeLevel(true); return; }
  rush.pos++;
  if (rush.pos >= rush.order.length){
    const total = rush.order.length;
    setStatus('Rushdown complete: ' + total + ' / ' + total + ' levels.');
    $('level').innerHTML = '<div class="stub"><h3>Rushdown complete!</h3><p>' + total + ' levels cleared.</p><button type="button">Back to channels</button></div>';
    $('lvlProg').textContent = '';
    $('level').querySelector('button').onclick = () => { rush = null; endRush(true); setStatus('Pick a channel, or let fate decide.'); closeLevel(); };
    return;
  }
  const next = rush.order[rush.pos], el = $('level');
  el.style.opacity = 0;
  setTimeout(() => { openIdx = next; sheet.style.background = BGS[next % 8]; mountLevel(next); el.style.opacity = 1; }, dur(100));
}

/* =====================================================================
   WIRING
   ===================================================================== */
const API = 'https://verifier-api.bacholate.workers.dev';
$('issueLink').href = REPO.replace(/\/+$/, '') + '/issues/new/choose';
$('contribBtn').onclick = () => $('pop').classList.toggle('open');

/* ---------- anonymous level submission ---------- */
$('openSubmit').onclick = () => {
  $('pop').classList.remove('open');
  $('sub').classList.add('open');
  $('subMsg').textContent = '';
  $('subMsg').className = 'feedback';
  $('f_id').focus();
};
function closeSubmit(){ $('sub').classList.remove('open'); }
$('subClose').onclick = closeSubmit;
$('subCancel').onclick = closeSubmit;
$('sub').onclick = e => { if (e.target === $('sub')) closeSubmit(); };

$('subform').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('subMsg'), send = $('subSend');
  msg.className = 'feedback';
  msg.textContent = 'Filing...';
  send.disabled = true;
  try {
    const res = await fetch(API + '/api/submit', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        level_id: $('f_id').value.trim(),
        title: $('f_title').value.trim(),
        desc: $('f_desc').value.trim(),
        prompt: $('f_prompt').value.trim(),
        solution: $('f_solution').value,
        website: $('f_website').value
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    msg.className = 'feedback ok';
    msg.innerHTML = 'Filed as issue #' + data.issue + '. <a href="' + data.url + '" target="_blank" rel="noopener">View it</a>';
    $('subform').reset();
  } catch (err) {
    msg.className = 'feedback bad';
    msg.textContent = err.message === 'Failed to fetch' ? 'Service unreachable. Try again later.' : err.message;
  } finally {
    send.disabled = false;
  }
});

$('randomBtn').onclick = randomPlay;
$('rushBtn').onclick = () => { if (rush){ endRush(); } else startRush(); };
$('back').onclick = () => { if (!busy) closeLevel(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if ($('sub').classList.contains('open')) return closeSubmit();
    if (openIdx >= 0 && !busy) closeLevel();
    else $('pop').classList.remove('open');
  }
});
addEventListener('resize', () => {
  if (openIdx >= 0 && !busy) Object.assign(sheet.style, frame({ left:0, top:0, width:innerWidth, height:innerHeight }, 0));
});

/* ---- compiled levels (Python in, captcha out) ---- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Prompts arrive from anonymous submissions, so everything is escaped.
function textLevel(lvl){
  return function mount(el, api){
    const wrap = mk('div', 'lv');
    wrap.innerHTML = '<h3>' + esc(lvl.title) + '</h3><p>' + esc(lvl.desc) + '</p>' +
      '<div class="prompt">' + esc(lvl.prompt) + '</div>' +
      '<input type="text" aria-label="Your answer" autocomplete="off" spellcheck="false">' +
      '<button class="primary" type="button">Check</button>';
    el.appendChild(wrap);
    const box = wrap.querySelector('input'), btn = wrap.querySelector('button');
    const norm = s => s.split(/\s+/).filter(Boolean).join(' ').toLowerCase();
    async function hash(s){
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    async function check(){
      if (!box.value.trim()) return;
      (await hash(norm(box.value)) === lvl.answer_sha) ? api.complete() : reject(wrap);
    }
    btn.onclick = check;
    box.onkeydown = e => { if (e.key === 'Enter') check(); };
    box.focus();
  };
}

async function loadCompiledLevels(){
  try {
    const res = await fetch('levels.json', { cache: 'no-cache' });
    if (!res.ok) return;
    const extra = await res.json();
    extra.forEach(l => LEVELS.push({
      id: l.id,
      name: l.title,
      preview: '<div class="pv pv-sum">' + esc(l.prompt.slice(0, 16)) + '</div>',
      mount: textLevel(l)
    }));
  } catch (e) { /* no compiled levels yet — the five built-ins still work */ }
}

loadCompiledLevels().then(buildGrid);
</script>
