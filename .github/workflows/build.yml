name: Build Levels

on:
  pull_request:
    paths: ["levels_src/**", "build_levels.py"]
  push:
    branches: [main]
    paths: ["levels_src/**", "build_levels.py"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every level source
        run: python build_levels.py
      - name: Self-check the compiled bundle
        run: |
          python - <<'PY'
          import json, re, pathlib
          levels = json.loads(pathlib.Path("levels.json").read_text())
          assert levels, "no levels compiled"
          for l in levels:
              assert re.fullmatch(r"[0-9a-f]{64}", l["answer_sha"]), f"bad hash for {l['id']}"
              assert l["prompt"], f"empty prompt for {l['id']}"
              assert l["answer_len"] > 0, f"empty answer for {l['id']}"
          src = pathlib.Path("app.js").read_text()
          assert "answer_sha" in src, "app.js does not read answer_sha"
          print(f"OK: {len(levels)} levels")
          PY
      - name: Reject raw answers leaking into the bundle
        run: |
          python - <<'PY'
          import json, pathlib, sys
          text = pathlib.Path("levels.json").read_text()
          for l in json.loads(text):
              if "answer" in l:
                  sys.exit(f"level {l['id']} exposes a raw answer field")
          print("OK: no raw answers in levels.json")
          PY
