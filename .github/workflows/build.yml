name: Site Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile submitted levels
        run: python build_levels.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check_site.js
