<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verifier — Are You Human?</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="clock" aria-hidden="true">
  <span id="clock">--:--</span>
  <span id="date"></span>
</header>

<main>
  <section id="menu" class="screen active">
    <h1 class="logo">Verifier</h1>
    <p class="tagline">Prove you are not a robot.</p>
    <div class="grid" id="grid"></div>
    <p class="hint" id="statusline"></p>
  </section>

  <section id="level" class="screen">
    <div class="panel">
      <span class="badge" id="levelnum"></span>
      <h2 id="ltitle"></h2>
      <p class="ldesc" id="ldesc"></p>
      <div class="prompt" id="lprompt"></div>
      <form id="answerform" autocomplete="off">
        <input id="lanswer" type="text" inputmode="text" autocomplete="off"
               spellcheck="false" placeholder="your answer" aria-label="Answer">
        <button type="submit">Verify</button>
      </form>
      <p class="feedback" id="feedback" role="status"></p>
      <button class="back" type="button" id="back">← Back</button>
    </div>
  </section>

  <section id="win" class="screen">
    <div class="panel win">
      <div class="mii" aria-hidden="true">✓</div>
      <h2>Verified Human</h2>
      <p class="ldesc" id="winstats"></p>
      <button class="back" type="button" id="again">Play again</button>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
