name = "verifier-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "abduznik/verifier"
ALLOWED_ORIGIN = "https://abduznik.github.io"

# Created by: npx wrangler kv namespace create RATE
# Paste the id it prints below, then run: npx wrangler deploy
[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_KV_ID"

# Secret, never in this file: npx wrangler secret put GITHUB_TOKEN
